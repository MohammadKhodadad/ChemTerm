services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chemterm
      POSTGRES_USER: chemterm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chemterm_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chemterm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chemterm -d chemterm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  chemterm-postgres:
